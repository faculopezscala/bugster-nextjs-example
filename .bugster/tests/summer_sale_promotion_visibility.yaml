name: Summer sale promotion visibility
page: /
page_path: app/page.tsx
task: Verify the summer sale promotion is visible on the homepage
steps:
- Navigate to the homepage
- Look for the summer sale promotional section
- Verify the promotional content is visible
- Verify any discount information is clearly displayed
- Check that the 'Add to cart' button may be disabled during the promotion
- Verify the button has the correct disabled styling (bg-blue-700)
expected_result: Summer sale promotional content is displayed correctly, but users
  should be aware that the 'Add to cart' functionality may be disabled during the
  promotion
