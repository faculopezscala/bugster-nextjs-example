name: Size selection validation
page: /
page_path: app/page.tsx
task: Verify users must select a size before adding to cart
steps:
- Navigate to the homepage
- Select a color for the product
- Do not select a size
- Verify the 'Add to cart' button is disabled
- Select a size for the product
- Verify the 'Add to cart' button becomes enabled
expected_result: The 'Add to cart' button is disabled when no size is selected
