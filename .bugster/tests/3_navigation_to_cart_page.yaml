name: Navigation to cart page
page: /
page_path: app/page.tsx
task: Verify users can navigate to cart page from the navigation menu
steps:
- Navigate to the homepage
- Verify the cart icon in the navigation bar is clickable regardless of product selection
  state
- Click on the cart icon in the navigation bar
- Verify redirect to cart page
- Verify the URL is /cart
- Return to homepage and verify cart navigation still works even when Add to Cart
  buttons are disabled
expected_result: User is redirected to the cart page, even when the Add to Cart button
  is disabled
