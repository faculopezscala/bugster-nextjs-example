name: Proceed to checkout from cart
page: cart
page_path: app/cart/page.tsx
task: Verify users can proceed to checkout from the cart page
steps:
- Add a product to cart from the homepage
- Navigate to the cart page
- Verify cart contains added items
- Click the 'Proceed to checkout' button
- Verify checkout process is initiated
expected_result: User is redirected to the checkout flow when clicking the checkout
  button
